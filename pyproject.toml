[project]
name = "radio-tui"
version = "0.1.0"
description = "Terminal radio player for Kosovo and Saudi Arabia stations"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
radio = "radio_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radio_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
